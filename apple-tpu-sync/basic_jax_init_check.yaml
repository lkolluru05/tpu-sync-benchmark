apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: tpu-init-jobset2
  namespace: default
  annotations:
    alpha.jobset.sigs.k8s.io/exclusive-topology: cloud.google.com/gke-tpu-slice-4x8-id
spec:
  failurePolicy:
    maxRestarts: 0
  replicatedJobs:
    - name: slice
      replicas: 1
      template:
        spec:
          parallelism: 8
          completions: 8
          completionMode: Indexed
          backoffLimit: 0
          template:
            spec:
              restartPolicy: Never
              hostAliases:
                - ip: 169.254.169.254
                  hostnames:
                    - metadata
                    - metadata.google.internal
              nodeSelector:
                cloud.google.com/gke-nodepool: tpu-pool-1
                cloud.google.com/gke-tpu-accelerator: tpu-v5-lite-podslice
                cloud.google.com/gke-tpu-topology: 4x8
              containers:
                - name: jax-tpu
                  image: us-docker.pkg.dev/cloud-tpu-images/jax-ai-image/tpu:latest
                  imagePullPolicy: IfNotPresent
                  ports:
                    - containerPort: 8471
                    - containerPort: 8476
                    - containerPort: 8431
                  securityContext:
                    privileged: true
                  env:
                    - name: PYTHONUNBUFFERED
                      value: "1"
                    - name: TPU_MIN_LOG_LEVEL
                      value: "0"
                    - name: TPU_STDERR_LOG_LEVEL
                      value: "0"
                    - name: LIBTPU_INIT_ARGS
                      value: "--slicebuilder_use_insecure_grpc=true --undefok=slicebuilder_use_insecure_grpc --xla_tpu_spmd_rng_bit_generator_unsafe=1 --xla_tpu_enable_latency_hiding_scheduler=true --xla_tpu_perform_spmd_cse_prevention=false"
                  command: ["/bin/bash", "-lc"]
                  args:
                    - |
                      set -euo pipefail
                      echo "[$(date -u +%H:%M:%S)] [rank=${JOB_COMPLETION_INDEX}] Host=$(hostname) IP=$(hostname -I | awk '{print $1}') TPU_WORKER_ID=${TPU_WORKER_ID:-unset}"
                      echo "[$(date -u +%H:%M:%S)] [rank=${JOB_COMPLETION_INDEX}] TPU_WORKER_HOSTNAMES=${TPU_WORKER_HOSTNAMES:-unset}"

                      pip install --progress-bar off "jax==0.11.2" "jaxlib==0.11.2" "libtpu==0.0.48" "requests"

                      python3 -u -c '
                      import jax
                      print("Calling jax.distributed.initialize() (auto-detect TPU)...", flush=True)
                      jax.distributed.initialize()
                      print("SUCCESS of jax init!")
                      devs = jax.devices()
                      print(f"SUCCESS! process_index={jax.process_index()}/{jax.process_count()}, local={len(jax.local_devices())}, global={len(devs)}", flush=True)
                      '
                  resources:
                    requests:
                      google.com/tpu: "4"
                      memory: "120Gi"
                      cpu: "24"
                    limits:
                      google.com/tpu: "4"
                      memory: "120Gi"
                      cpu: "24"